name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unzip project
        run: |
          mkdir proj
          ZIP=$(ls AIAssistant_*.zip | sort -V | tail -1)
          echo "Using $ZIP"
          unzip -q "$ZIP" -d proj
          chmod +x proj/AIAssistant/gradlew
      - name: Build
        working-directory: proj/AIAssistant
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: proj/AIAssistant/app/build/outputs/apk/debug/app-debug.apk
